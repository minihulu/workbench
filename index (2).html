<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · 连接服务</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:linear-gradient(160deg,#0f172a,#1e293b);color:#e2e8f0;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .box{background:#1e293b;padding:30px 34px;border-radius:18px;width:360px;
       box-shadow:0 24px 60px rgba(0,0,0,.45);border:1px solid #334155}
  h1{font-size:19px;margin:0 0 6px}
  p{color:#94a3b8;font-size:13px;margin:0 0 18px;line-height:1.6}
  input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid #334155;
        background:#0f172a;color:#e2e8f0;font-size:14px;outline:none}
  input:focus{border-color:#4f46e5}
  button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:10px;
         background:#4f46e5;color:#fff;font-size:14px;cursor:pointer;font-weight:600}
  button:hover{background:#4338ca}
  .hint{margin-top:14px;font-size:12px;color:#64748b;line-height:1.6}
  .hint code{background:#0f172a;padding:1px 6px;border-radius:6px;color:#94a3b8}
</style>
</head>
<body>
  <div class="box">
    <h1>工作台</h1>
    <p>输入后端服务地址，进入你的工作台。</p>
    <input id="url" placeholder="http://localhost:8000" spellcheck="false" autocomplete="off">
    <button id="go">进入</button>
    <div class="hint">
      默认连本机服务（需先运行 <code>python3 server.py</code>）；<br>
      也可填你部署的 https 域名，如 <code>https://workbench.example.com</code>。<br>
      登录同一账号即可多端同步。
    </div>
  </div>
<script>
  const el = document.getElementById('url');
  el.value = localStorage.getItem('wb_base') || 'http://localhost:8000';
  function go(){
    let u = (el.value || '').trim().replace(/\/+$/, '');
    if(!u) return;
    localStorage.setItem('wb_base', u);
    location.href = u + '/workbench.html';
  }
  document.getElementById('go').onclick = go;
  el.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
</script>
</body>
</html>
